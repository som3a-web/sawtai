services:
  - type: web
    name: sawtai-prototype
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerContext: .
    dockerfilePath: ./infra/render/Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: SAWTAI_ENV
        value: prototype
      - key: SAWTAI_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: sawtai-postgres
          property: connectionString
      - key: ALEMBIC_DATABASE_URL
        fromDatabase:
          name: sawtai-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sawtai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TENANT_PEPPER
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_SIGNATURE_REQUIRED
        value: "true"
      - key: WHATSAPP_DELIVERY_MODE
        value: simulate
      - key: WHATSAPP_REPLY_MODE
        value: draft
      - key: WHATSAPP_TENANT_CODE
        value: shj-demo
      - key: WHATSAPP_SOURCE_HANDLE
        value: demo-whatsapp

  - type: worker
    name: sawtai-worker
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerContext: .
    dockerfilePath: ./infra/render/Dockerfile.worker
    envVars:
      - key: SAWTAI_ENV
        value: prototype
      - key: SAWTAI_LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: sawtai-postgres
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: sawtai-redis
          property: connectionString
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DELIVERY_MODE
        value: simulate
      - key: WHATSAPP_REPLY_MODE
        value: draft
      - key: WHATSAPP_TENANT_CODE
        value: shj-demo
      - key: WHATSAPP_SOURCE_HANDLE
        value: demo-whatsapp

databases:
  - name: sawtai-postgres
    databaseName: sawtai
    user: sawtai
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
  - name: sawtai-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
