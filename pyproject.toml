[project]
name = "sawtai"
version = "0.1.0"
description = "Arabic-first government communication intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "arq==0.26.3",
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "minio==7.2.15",
  "Pillow==11.1.0",
  "pypdf==5.3.0",
  "pypdfium2==4.30.0",
  "pydantic-settings==2.7.1",
  "pytesseract==0.3.13",
  "PyJWT==2.10.1",
  "python-docx==1.1.2",
  "python-multipart==0.0.20",
  "psycopg[binary]==3.2.4",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.37",
  "structlog==24.4.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "import-linter==2.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/api/src/sawtai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["sawtai"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires the seeded PostgreSQL development stack",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sawtai"]
mypy_path = "services/api/src"

[[tool.mypy.overrides]]
module = ["docx.*", "minio.*", "PIL.*", "pypdf.*", "pypdfium2.*", "pytesseract.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["sawtai"]

[[tool.importlinter.contracts]]
name = "Domain modules are independent"
type = "independence"
modules = [
  "sawtai.analytics",
  "sawtai.cases",
  "sawtai.crisis",
  "sawtai.data",
  "sawtai.ingest",
  "sawtai.nlp",
  "sawtai.rag",
]
